[package]
name = "sculpt-region"
version = "0.1.0"
edition = "2024"
description = "The region tools: box and lasso select, hide, mask, trim and split, and mask extract."

[dependencies]
glam = { workspace = true }
rayon = { workspace = true }
egui = { workspace = true }
sculpt-geom = { path = "../geom" }
sculpt-toolkit = { path = "../toolkit" }
sculpt-cut = { path = "../cut" }

# Only the tests: they draw shapes over the copies of a real array's layout
# (tests/copies.rs). The tools themselves know nothing of arrays.
[dev-dependencies]
sculpt-array = { path = "../array" }
